<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Jump Barrels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-family: monospace;
            z-index: 1000;
        }

        #loading h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #ff6b00;
            animation: pulse 1s infinite;
        }

        #loading p {
            font-size: 0.8rem;
            animation: blink 1s infinite;
        }

        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff3333;
            color: white;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            z-index: 2000;
            display: none;
            max-width: 80%;
        }

        #error h2 {
            margin-bottom: 1rem;
        }

        #error code {
            display: block;
            background: #000;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
            text-align: left;
            overflow-x: auto;
            font-size: 0.8rem;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>CAT JUMP BARRELS</h1>
        <p>Loading game...</p>
    </div>
    <div id="error"></div>
    <div id="root"></div>

    <script>
        window.addEventListener('error', function(e) {
            console.error('Error:', e);
            showError('JavaScript Error', e.message);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled rejection:', e);
            showError('Unhandled Promise Rejection', e.reason);
        });

        function showError(title, message) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `
                <h2>${title}</h2>
                <p>${message}</p>
                <code>${message}</code>
            `;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        // Try to load the Kotlin WASM app
        (async function() {
            try {
                console.log('Starting to load Cat Jump Barrels...');
                console.log('Location:', window.location.href);

                // Import the webApp module
                const { root } = await import('./webApp/build/kotlin-webpack/js/developmentExecutable/catjumpbarrels.js');
                console.log('catjumpbarrels.js loaded successfully');

                // Hide loading and show game
                hideLoading();
                console.log('Game started!');
            } catch (error) {
                console.error('Failed to load game:', error);
                showError('Failed to Load Game', error.message + '\n\nCheck browser console for details.');
            }
        })();
    </script>
</body>
</html>
