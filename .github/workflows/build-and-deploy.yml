name: Build and Deploy

on:
  push:
      branches: [ "develop", "main" ]
        pull_request:
            branches: [ "develop", "main" ]
              release:
                  types: [created]

                  jobs:
                    build:
                        runs-on: ${{ matrix.os }}
                            strategy:
                                  matrix:
                                          os: [ubuntu-latest, windows-latest, macos-latest]

                                                  steps:
                                                      - name: Checkout code
                                                            uses: actions/checkout@v4

                                                                      - name: Set up JDK 17
                                                                            uses: actions/setup-java@v4
                                                                                  with:
                                                                                          java-version: '17'
                                                                                                  distribution: 'temurin'
                                                                                                          cache: gradle
                                                                                                                  
                                                                                                                      - name: Grant execute permission for gradlew
                                                                                                                            if: runner.os != 'Windows'
                                                                                                                                  run: chmod +x gradlew
                                                                                                                                        
                                                                                                                                            - name: Build with Gradle
                                                                                                                                                  run: ./gradlew build --no-daemon
                                                                                                                                                        
                                                                                                                                                            - name: Run tests
                                                                                                                                                                  run: ./gradlew test --no-daemon
                                                                                                                                                                        
                                                                                                                                                                            - name: Create distributable packages
                                                                                                                                                                                  run: |
                                                                                                                                                                                          if [ "${{ runner.os }}" == "Linux" ]; then
                                                                                                                                                                                                    ./gradlew :composeApp:packageDeb --no-daemon
                                                                                                                                                                                                              ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon
                                                                                                                                                                                                                      elif [ "${{ runner.os }}" == "macOS" ]; then
                                                                                                                                                                                                                                ./gradlew :composeApp:packageDmg --no-daemon
                                                                                                                                                                                                                                        elif [ "${{ runner.os }}" == "Windows" ]; then
                                                                                                                                                                                                                                                  ./gradlew.bat :composeApp:packageMsi --no-daemon
                                                                                                                                                                                                                                                          fi
                                                                                                                                                                                                                                                                shell: bash
                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                          - name: Upload artifacts
                                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                      with:
                                                                                                                                                                                                                                                                                              name: CatJumpsBarrels-${{ runner.os }}
                                                                                                                                                                                                                                                                                                      path: |
                                                                                                                                                                                                                                                                                                                composeApp/build/compose/binaries/main/**/*
                                                                                                                                                                                                                                                                                                                          composeApp/build/compose/jars/**/*
                                                                                                                                                                                                                                                                                                                                  retention-days: 30
                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                            release:
                                                                                                                                                                                                                                                                                                                                                if: github.event_name == 'release'
                                                                                                                                                                                                                                                                                                                                                    needs: build
                                                                                                                                                                                                                                                                                                                                                        runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                            permissions:
                                                                                                                                                                                                                                                                                                                                                                  contents: write
                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                          steps:
                                                                                                                                                                                                                                                                                                                                                                              - name: Download all artifacts
                                                                                                                                                                                                                                                                                                                                                                                    uses: actions/download-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                              - name: Upload release assets
                                                                                                                                                                                                                                                                                                                                                                                                    uses: softprops/action-gh-release@v1
                                                                                                                                                                                                                                                                                                                                                                                                          with:
                                                                                                                                                                                                                                                                                                                                                                                                                  files: |
                                                                                                                                                                                                                                                                                                                                                                                                                            CatJumpsBarrels-*/**/*
                                                                                                                                                                                                                                                                                                                                                                                                                                  env:
                                                                                                                                                                                                                                                                                                                                                                                                                                          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
